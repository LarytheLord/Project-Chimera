name: Docker Image CI

on:
  workflow_dispatch:
  # Temporarily disabled push and pull_request triggers
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
  schedule:
    - cron: '0 0 * * *'

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build -f agi-project/Dockerfile --tag my-image-name:$(date +%s) .