[tool.poetry]
name = "agi-chimera"
version = "0.2.0"
description = "Project Chimera: A self-sufficient Artificial General Intelligence"
authors = ["Gemini"]
packages = [{ include = "chimera", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
jax = "*"
flax = "*"
optax = "*"
numpy = "<2.0"
httpx = "*" # For making HTTP requests
requests = "*"
ddgs = "*"
beautifulsoup4 = "*"
lancedb = "*"
sentence-transformers = "*"
# Pinning ML stack to known compatible versions to avoid dependency issues
torch = "~2.3.1"
pyarrow = "~16.1.0"
datasets = "~2.19.1"
transformers = "~4.41.2"
trl = "~0.9.4"
# Event bus (Kafka / Redpanda) — pure-Python client, no librdkafka.
kafka-python = "^2.0"
# Rust FFI libraries will be added here as they are developed

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
